      <main>
        <h1>Your next release, better together.</h1>
        <p>
          OCLaunch is the community launch workspace from Orangecloud (orangecloud.vn), published
          at launch.orangecloud.vn. Solo founders use it to capture a product release, collect a
          focused review, export accepted findings for a coding agent, and keep a report of what
          got better. The workspace is available in English and Vietnamese for founders in Vietnam
          and everywhere else.
        </p>
        <h2>A landing page for the release you are about to ship</h2>
        <p>
          OCLaunch is the home for one product: who it is for, the task a new user must finish,
          and the release URL under review. New projects are private until you choose an unlisted
          passport link or a public Discover listing.
        </p>
        <h2>How OCLaunch works</h2>
        <ol>
          <li>Capture the release URL and environment. Automated checks do not bypass bot protection.</li>
          <li>Collect a focused review of the primary user task.</li>
          <li>Accept findings and export them as tasks for your coding agent.</li>
          <li>Verify what got better and write a release report.</li>
        </ol>
        <h2>How to run your first improvement loop</h2>
        <ol>
          <li>Sign in with a passkey.</li>
          <li>Add your project. Visibility starts private.</li>
          <li>Capture a release URL.</li>
          <li>Run automated checks or invite a reviewer. Owners cannot review their own project.</li>
          <li>Triage each finding: accept, ask for evidence, or dismiss with a reason.</li>
          <li>Export the task bundle from the improvement studio.</li>
          <li>Verify the finding and generate a release report.</li>
        </ol>
        <h2>The value OCLaunch brings</h2>
        <p>
          The return is operational, not a promised revenue figure: less time reconstructing chat
          feedback, fewer fixes aimed at the wrong task, a cleaner handoff to a coding agent, and
          a release report of what improved.
        </p>
        <h2>Built for founders in Vietnam, open everywhere</h2>
        <p>
          Founders in Ho Chi Minh City, Hanoi, Da Nang, or working remotely use the same loop.
          Write the primary task in Vietnamese when the product is for users in Vietnam.
        </p>
        <h2>Questions about OCLaunch</h2>
        <h3>What is OCLaunch?</h3>
        <p>
          OCLaunch is a community workspace from Orangecloud that helps solo founders turn product
          feedback into reviewed improvements and a release record. You capture a release URL,
          collect a focused review of one user task, export accepted findings for a coding agent,
          and verify what got better. The public site is https://launch.orangecloud.vn/.
        </p>
        <h3>Who is OCLaunch for?</h3>
        <p>
          OCLaunch is for solo founders and small product teams who ship a web app and need
          structured feedback before the next release. Reviewers can also open public missions and
          leave useful notes. Project owners cannot review their own project.
        </p>
        <h3>How does OCLaunch work?</h3>
        <p>
          OCLaunch runs a four-part loop: capture a release, request a focused review, accept
          findings and export improvements, then verify and write a report. Automated checks read
          the captured URL. A human review records what the person tried, what they expected, and
          where they got stuck.
        </p>
        <h3>How do I start a project on OCLaunch?</h3>
        <p>
          Sign in with a passkey, add a project, and describe the purpose, audience, and primary
          user task. New projects are private. Capture a release URL, run automated checks or
          invite a reviewer, then export accepted findings from the improvement studio.
        </p>
        <h3>What return does OCLaunch bring?</h3>
        <p>
          The return is operational. Founders spend less time reconstructing chat feedback, fix the
          user task people actually failed, hand accepted findings to a coding agent without
          rewriting them, and keep a report of what improved. OCLaunch does not promise a revenue
          percentage. The gain is clearest when every release currently loses hours to unstructured
          comments.
        </p>
        <h3>Does OCLaunch support Vietnamese?</h3>
        <p>
          Yes. OCLaunch is available in English and Vietnamese. Switch language in the header.
          Write the primary task and review notes in the language your users read, including
          Vietnamese for products aimed at Vietnam.
        </p>
        <h3>Is my OCLaunch project public?</h3>
        <p>
          No. A new project is private. You can later set it to unlisted, which shares a passport
          link only, or public, which lists it on Discover.
        </p>
        <h3>Where is OCLaunch available?</h3>
        <p>
          OCLaunch is published by Orangecloud at https://launch.orangecloud.vn/ for founders in
          Vietnam and anywhere else. The interface supports English and Vietnamese. Passkeys are
          how you sign in.
        </p>
