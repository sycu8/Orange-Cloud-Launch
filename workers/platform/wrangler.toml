# OCLaunch platform Worker — local + environment stubs.
# Resource IDs are placeholders until the owner provisions Cloudflare resources.
name = "oclaunch-platform-dev"
main = "src/index.ts"
compatibility_date = "2026-09-25"
workers_dev = true

[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/p/*", "/r/*"]

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "oclaunch-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "oclaunch-artifacts-local"
preview_bucket_name = "oclaunch-artifacts-local"

[vars]
APP_ENV = "development"
APP_ORIGIN = "http://localhost:8787"
WEBAUTHN_RP_ID = "localhost"
ENABLE_PATCH_PR = "false"
ENABLE_PROJECT_DOMAINS = "false"
ENABLE_BROWSER_RUN = "true"
ENABLE_WORKERS_AI = "false"
RULESET_VERSION = "1.0.0"

# Browser Run is on by default. remote is only for local wrangler dev (quickAction).
[browser]
binding = "BROWSER"
remote = true

# Queues require remote provisioning; local path uses transactional outbox + sync processor.
# [[queues.producers]]
# binding = "JOBS"
# queue = "oclaunch-jobs-local"

[env.staging]
name = "oclaunch-platform-staging"
workers_dev = true
# Prefer the custom domain for WebAuthn; disable version preview hosts.
preview_urls = false
routes = [{ pattern = "launch-staging.orangecloud.vn", custom_domain = true }]
[env.staging.vars]
APP_ENV = "staging"
APP_ORIGIN = "https://launch-staging.orangecloud.vn"
WEBAUTHN_RP_ID = "launch-staging.orangecloud.vn"
# Optional: workers.dev still serves this Worker for emergency access.
APP_ORIGINS_EXTRA = "https://oclaunch-platform-staging.sycu-lee.workers.dev"
ENABLE_PATCH_PR = "false"
ENABLE_PROJECT_DOMAINS = "false"
ENABLE_BROWSER_RUN = "true"
ENABLE_WORKERS_AI = "false"
RULESET_VERSION = "1.0.0"
[env.staging.browser]
binding = "BROWSER"
remote = true
[[env.staging.d1_databases]]
binding = "DB"
database_name = "oclaunch-staging"
database_id = "REPLACE_WITH_STAGING_DATABASE_ID"
migrations_dir = "../../migrations"
[[env.staging.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "oclaunch-artifacts-staging"

[env.production]
name = "oclaunch-platform-production"
workers_dev = false
preview_urls = false
routes = [{ pattern = "launch.orangecloud.vn", custom_domain = true }]
[env.production.vars]
APP_ENV = "production"
APP_ORIGIN = "https://launch.orangecloud.vn"
WEBAUTHN_RP_ID = "launch.orangecloud.vn"
ENABLE_PATCH_PR = "false"
ENABLE_PROJECT_DOMAINS = "false"
ENABLE_BROWSER_RUN = "true"
ENABLE_WORKERS_AI = "false"
RULESET_VERSION = "1.0.0"
[env.production.browser]
binding = "BROWSER"
remote = true
[[env.production.d1_databases]]
binding = "DB"
database_name = "oclaunch-production"
database_id = "REPLACE_WITH_PRODUCTION_DATABASE_ID"
migrations_dir = "../../migrations"
[[env.production.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "oclaunch-artifacts-production"
