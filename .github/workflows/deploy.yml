# Manual Cloudflare Workers deploy for OCLaunch.
# Trigger only. Merging this file does not deploy.
# Credentials come from GitHub Actions secrets/vars. Never commit values.
name: Deploy OCLaunch

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Wrangler environment
        type: choice
        options:
          - staging
          - production
        default: staging
      confirm:
        description: For production, type launch.orangecloud.vn. Leave empty for staging.
        type: string
        required: false
  # workflow_dispatch is preferred. This push path exists because the
  # integration token cannot call the Actions dispatch API. A push only
  # deploys staging (never production). Staging deploy applies remote D1
  # migrations before publishing (including 0003_browser_observation.sql).
  # Browser Run (ENABLE_BROWSER_RUN) ships on by default with the BROWSER binding.
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yml
      - workers/platform/**
      - apps/web/**
      - packages/shared/**
      - migrations/**

permissions:
  contents: read

concurrency:
  group: oclaunch-deploy-${{ github.event_name == 'push' && 'staging' || inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Push events deploy staging only. Production still requires workflow_dispatch.
      WRANGLER_ENV: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Require a known environment
        run: |
          case "$WRANGLER_ENV" in
            staging|production) ;;
            *)
              echo "Unsupported environment: $WRANGLER_ENV"
              exit 1
              ;;
          esac

      - name: Confirm production hostname
        if: inputs.environment == 'production'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "launch.orangecloud.vn" ]; then
            echo "Production deploy refused. Set confirm to launch.orangecloud.vn."
            exit 1
          fi

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing GitHub Actions secret or variable: CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo "CLOUDFLARE_D1_DATABASE_ID is not set; resolving the D1 database by name"
          fi

      - name: Inject D1 id and optional R2 bucket from secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, sys, urllib.error, urllib.parse, urllib.request
          env = os.environ["WRANGLER_ENV"]
          placeholders = {
              "staging": "REPLACE_WITH_STAGING_DATABASE_ID",
              "production": "REPLACE_WITH_PRODUCTION_DATABASE_ID",
          }
          database_names = {
              "staging": "oclaunch-staging",
              "production": "oclaunch-production",
          }
          default_buckets = {
              "staging": "oclaunch-artifacts-staging",
              "production": "oclaunch-artifacts-production",
          }
          if env not in placeholders:
              print("Unsupported environment")
              sys.exit(1)
          database_id = os.environ.get("CLOUDFLARE_D1_DATABASE_ID", "").strip()
          source = "CLOUDFLARE_D1_DATABASE_ID"
          if not database_id:
              db_name = database_names[env]
              account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
              token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
              if not account or not token:
                  print("Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID")
                  sys.exit(1)
              url = (
                  "https://api.cloudflare.com/client/v4/accounts/"
                  + urllib.parse.quote(account)
                  + "/d1/database?name="
                  + urllib.parse.quote(db_name)
              )
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(req) as resp:
                      payload = json.load(resp)
              except urllib.error.HTTPError as exc:
                  print(f"Cloudflare D1 list failed for {db_name} with HTTP {exc.code}")
                  sys.exit(1)
              rows = [row for row in (payload.get("result") or []) if row.get("name") == db_name]
              if len(rows) != 1 or not rows[0].get("uuid"):
                  print(f"Could not resolve one D1 database named {db_name}")
                  sys.exit(1)
              database_id = str(rows[0]["uuid"]).strip()
              source = f"Cloudflare API name {db_name}"
          if not re.fullmatch(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", database_id):
              print(f"D1 database id from {source} is not a UUID")
              sys.exit(1)
          path = pathlib.Path("workers/platform/wrangler.toml")
          text = path.read_text()
          placeholder = placeholders[env]
          if placeholder not in text:
              print(f"workers/platform/wrangler.toml is missing {placeholder}")
              sys.exit(1)
          text = text.replace(placeholder, database_id, 1)
          bucket = os.environ.get("CLOUDFLARE_R2_BUCKET_NAME", "").strip()
          if bucket:
              if not re.fullmatch(r"[a-z0-9][a-z0-9-]{1,61}[a-z0-9]", bucket):
                  print("GitHub Actions secret CLOUDFLARE_R2_BUCKET_NAME is not a valid bucket name")
                  sys.exit(1)
              needle = f'bucket_name = "{default_buckets[env]}"'
              if needle not in text:
                  print(f"workers/platform/wrangler.toml has no default bucket_name for {env}")
                  sys.exit(1)
              text = text.replace(needle, f'bucket_name = "{bucket}"', 1)
              print("Injected R2 bucket name from CLOUDFLARE_R2_BUCKET_NAME")
          else:
              print("CLOUDFLARE_R2_BUCKET_NAME is not set; using the bucket name in wrangler.toml")
          if env == "staging":
              account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
              token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
              if not account or not token:
                  print("Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID")
                  sys.exit(1)
              sub_url = (
                  "https://api.cloudflare.com/client/v4/accounts/"
                  + urllib.parse.quote(account)
                  + "/workers/subdomain"
              )
              sub_req = urllib.request.Request(sub_url, headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(sub_req) as resp:
                      sub_payload = json.load(resp)
              except urllib.error.HTTPError as exc:
                  print(f"Cloudflare workers subdomain lookup failed with HTTP {exc.code}")
                  sys.exit(1)
              subdomain = str((sub_payload.get("result") or {}).get("subdomain") or "").strip()
              if not re.fullmatch(r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?", subdomain):
                  print("Cloudflare account workers.dev subdomain was not returned")
                  sys.exit(1)
              host = f"oclaunch-platform-staging.{subdomain}.workers.dev"
              origin = f"https://{host}"
              # Keep wrangler.toml in sync if the account workers.dev subdomain changes.
              for old_host in (
                  "oclaunch-platform-staging.sycu-lee.workers.dev",
                  "launch-staging.orangecloud.vn",
              ):
                  text = text.replace(
                      f'APP_ORIGIN = "https://{old_host}"',
                      f'APP_ORIGIN = "{origin}"',
                      1,
                  )
                  text = text.replace(
                      f'WEBAUTHN_RP_ID = "{old_host}"',
                      f'WEBAUTHN_RP_ID = "{host}"',
                      1,
                  )
              if f'APP_ORIGIN = "{origin}"' not in text:
                  print("workers/platform/wrangler.toml is missing a staging APP_ORIGIN to rewrite")
                  sys.exit(1)
              print(f"Staging public URL: {origin}")
          path.write_text(text)
          print(f"Injected D1 database id for {env} from {source}")
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build assets
        run: |
          npm ci
          npm run build -w @oclaunch/shared
          npm run build -w @oclaunch/web

      - name: Apply D1 migrations and deploy
        working-directory: workers/platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply "oclaunch-${WRANGLER_ENV}" --remote --env "$WRANGLER_ENV"
          npx wrangler deploy --env "$WRANGLER_ENV"

      - name: Sync optional Worker secrets
        working-directory: workers/platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
        run: |
          set +x
          sync_secret() {
            name="$1"
            case "$name" in
              SESSION_SECRET) value="$SESSION_SECRET" ;;
              GITHUB_APP_ID) value="$GITHUB_APP_ID" ;;
              GITHUB_WEBHOOK_SECRET) value="$GITHUB_WEBHOOK_SECRET" ;;
              MAINTENANCE_SECRET) value="$MAINTENANCE_SECRET" ;;
              *)
                echo "Refusing unknown Worker secret name: $name"
                return 1
                ;;
            esac
            if [ -z "$value" ]; then
              echo "GitHub Actions secret not set: $name (Worker secret left unchanged)"
              return 0
            fi
            printf '%s' "$value" | npx wrangler secret put "$name" --env "$WRANGLER_ENV"
            echo "Updated Worker secret: $name"
          }
          if [ "$WRANGLER_ENV" = "staging" ]; then
            if npx wrangler secret list --env staging | grep -q 'SESSION_SECRET'; then
              echo "Worker secret SESSION_SECRET already set"
            else
              openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put SESSION_SECRET --env staging
              echo "Set Worker secret SESSION_SECRET"
            fi
          else
            sync_secret SESSION_SECRET
          fi
          sync_secret GITHUB_APP_ID
          sync_secret GITHUB_WEBHOOK_SECRET
          sync_secret MAINTENANCE_SECRET
