# Manual Cloudflare Workers deploy for OCLaunch.
# Trigger only. Merging this file does not deploy.
# Credentials come from GitHub Actions secrets/vars. Never commit values.
name: Deploy OCLaunch

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Wrangler environment
        type: choice
        options:
          - staging
          - production
        default: staging
      confirm:
        description: For production, type launch.orangecloud.vn. Leave empty for staging.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: oclaunch-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Require a known environment
        env:
          WRANGLER_ENV: ${{ inputs.environment }}
        run: |
          case "$WRANGLER_ENV" in
            staging|production) ;;
            *)
              echo "Unsupported environment: $WRANGLER_ENV"
              exit 1
              ;;
          esac

      - name: Confirm production hostname
        if: inputs.environment == 'production'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "launch.orangecloud.vn" ]; then
            echo "Production deploy refused. Set confirm to launch.orangecloud.vn."
            exit 1
          fi

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing GitHub Actions secret or variable: CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Refuse placeholder D1 database ids
        env:
          WRANGLER_ENV: ${{ inputs.environment }}
        run: |
          section=$(awk -v env="$WRANGLER_ENV" '
            $0 == ("[env." env "]") { found = 1; next }
            found && $0 ~ /^\[env\.[^.]+\]$/ { exit }
            found { print }
          ' workers/platform/wrangler.toml)
          if [ -z "$section" ]; then
            echo "workers/platform/wrangler.toml has no [env.${WRANGLER_ENV}] section"
            exit 1
          fi
          if printf '%s\n' "$section" | grep -q 'REPLACE_WITH_'; then
            echo "workers/platform/wrangler.toml still has a placeholder database_id for ${WRANGLER_ENV}."
            echo "Replace REPLACE_WITH_*_DATABASE_ID before deploy."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build assets
        run: |
          npm ci
          npm run build -w @oclaunch/shared
          npm run build -w @oclaunch/web

      - name: Apply D1 migrations and deploy
        working-directory: workers/platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: ${{ inputs.environment }}
        run: |
          npx wrangler d1 migrations apply "oclaunch-${WRANGLER_ENV}" --env "$WRANGLER_ENV"
          npx wrangler deploy --env "$WRANGLER_ENV"

      - name: Sync optional Worker secrets
        working-directory: workers/platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: ${{ inputs.environment }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
        run: |
          set +x
          sync_secret() {
            name="$1"
            case "$name" in
              SESSION_SECRET) value="$SESSION_SECRET" ;;
              GITHUB_APP_ID) value="$GITHUB_APP_ID" ;;
              GITHUB_WEBHOOK_SECRET) value="$GITHUB_WEBHOOK_SECRET" ;;
              *)
                echo "Refusing unknown Worker secret name: $name"
                return 1
                ;;
            esac
            if [ -z "$value" ]; then
              echo "GitHub Actions secret not set: $name (Worker secret left unchanged)"
              return 0
            fi
            printf '%s' "$value" | npx wrangler secret put "$name" --env "$WRANGLER_ENV"
            echo "Updated Worker secret: $name"
          }
          sync_secret SESSION_SECRET
          sync_secret GITHUB_APP_ID
          sync_secret GITHUB_WEBHOOK_SECRET
