<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1040" role="img" aria-label="OCLaunch Cloudflare architecture overview"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7D908C"/></marker></defs><rect width="1280" height="1040" rx="24" fill="#FAF8F5"/><g font-family="Arial, sans-serif"><text x="44" y="46" font-size="12" letter-spacing="2" fill="#C2410C">OCLAUNCH / CLOUDFLARE ARCHITECTURE</text><text x="44" y="89" font-size="32" font-weight="700" fill="#17252B">One workspace. Clear trust boundaries.</text><rect x="24" y="203" width="1232" height="655" rx="24" fill="#FFFFFF" stroke="#DFE4E2"/><text x="48" y="233" font-size="12" letter-spacing="1.5" fill="#59676D">TRUSTED OCLAUNCH SERVICES ON CLOUDFLARE</text><path d="M210 183 L210 263" fill="none" stroke="#7D908C" stroke-width="2" marker-end="url(#arrow)"/><path d="M490 301 L566 301" fill="none" stroke="#7D908C" stroke-width="2" marker-end="url(#arrow)"/><path d="M970 301 L1040 301" fill="none" stroke="#7D908C" stroke-width="2" marker-end="url(#arrow)"/><path d="M290 339 L290 393" fill="none" stroke="#7D908C" stroke-width="2" marker-end="url(#arrow)"/><path d="M425 431 L566 431" fill="none" stroke="#7D908C" stroke-width="2" marker-end="url(#arrow)"/><path d="M770 339 L770 393" fill="none" stroke="#7D908C" stroke-width="2" marker-end="url(#arrow)"/><path d="M770 469 L770 510" fill="none" stroke="#7D908C" stroke-width="2" marker-end="url(#arrow)"/><path d="M770 586 L770 631" fill="none" stroke="#7D908C" stroke-width="2" marker-end="url(#arrow)"/><path d="M425 668 L540 668" fill="none" stroke="#7D908C" stroke-width="2" marker-end="url(#arrow)"/><path d="M940 668 L1050 668" fill="none" stroke="#7D908C" stroke-width="2" marker-end="url(#arrow)"/><path d="M1080 706 L1080 885" fill="none" stroke="#7D908C" stroke-width="2" marker-end="url(#arrow)"/><path d="M770 706 L770 746" fill="none" stroke="#7D908C" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 784 L470 784" fill="none" stroke="#7D908C" stroke-width="2" marker-end="url(#arrow)"/><path d="M1080 961 L1080 989" fill="none" stroke="#7D908C" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="111" width="280" height="72" rx="16" fill="#FFF0E7" stroke="#F1CFBC"/><text x="90" y="142" font-size="18" font-weight="700" fill="#17252B">Founders &amp; reviewers</text><text x="90" y="167" font-size="13" fill="#17252B">Browser / community workspace</text><rect x="70" y="263" width="420" height="76" rx="16" fill="#17252B" stroke="#17252B"/><text x="90" y="294" font-size="18" font-weight="700" fill="#FFFFFF">Edge → Web + API Worker</text><text x="90" y="319" font-size="13" fill="#FFFFFF">launch.orangecloud.vn · React / TypeScript</text><rect x="566" y="263" width="404" height="76" rx="16" fill="#FFFFFF" stroke="#D9E0DD"/><text x="586" y="294" font-size="18" font-weight="700" fill="#17252B">D1 · authoritative state</text><text x="586" y="319" font-size="13" fill="#17252B">Permissions · releases · findings · transactional outbox</text><rect x="1040" y="263" width="172" height="76" rx="16" fill="#FFFFFF" stroke="#D9E0DD"/><text x="1060" y="294" font-size="18" font-weight="700" fill="#17252B">R2</text><text x="1060" y="319" font-size="13" fill="#17252B">Private evidence</text><rect x="155" y="393" width="270" height="76" rx="16" fill="#FFFFFF" stroke="#D9E0DD"/><text x="175" y="424" font-size="18" font-weight="700" fill="#17252B">Admission DOs</text><text x="175" y="449" font-size="13" fill="#17252B">Budgets &amp; expiring resource leases</text><rect x="566" y="393" width="404" height="76" rx="16" fill="#FFFFFF" stroke="#D9E0DD"/><text x="586" y="424" font-size="18" font-weight="700" fill="#17252B">Outbox relay → Queue</text><text x="586" y="449" font-size="13" fill="#17252B">Durable intent · deduplication · dead-letter queue</text><rect x="566" y="510" width="404" height="76" rx="16" fill="#FFFFFF" stroke="#D9E0DD"/><text x="586" y="541" font-size="18" font-weight="700" fill="#17252B">Consumer → Workflows</text><text x="586" y="566" font-size="13" fill="#17252B">Review, patch, verification and report jobs</text><rect x="95" y="631" width="330" height="76" rx="16" fill="#FFFFFF" stroke="#D9E0DD"/><text x="115" y="662" font-size="18" font-weight="700" fill="#17252B">Browser Run</text><text x="115" y="687" font-size="13" fill="#17252B">Screenshots &amp; bounded task checks</text><rect x="540" y="631" width="400" height="76" rx="16" fill="#FFFFFF" stroke="#D9E0DD"/><text x="560" y="662" font-size="18" font-weight="700" fill="#17252B">Workers AI</text><text x="560" y="687" font-size="13" fill="#17252B">Grounded suggestions · structured summaries</text><rect x="1050" y="631" width="170" height="76" rx="16" fill="#FFFFFF" stroke="#D9E0DD"/><text x="1070" y="662" font-size="18" font-weight="700" fill="#17252B">GitHub broker</text><text x="1070" y="687" font-size="13" fill="#17252B">Scoped PR writes</text><rect x="570" y="746" width="400" height="76" rx="16" fill="#FFFFFF" stroke="#D9E0DD"/><text x="590" y="777" font-size="18" font-weight="700" fill="#17252B">Build controller</text><text x="590" y="802" font-size="13" fill="#17252B">Sandbox lifecycle · no source-control secrets</text><rect x="75" y="746" width="395" height="76" rx="16" fill="#FFF0E7" stroke="#E7BCA5"/><text x="95" y="777" font-size="18" font-weight="700" fill="#17252B">Sandbox / Containers</text><text x="95" y="802" font-size="13" fill="#17252B">Untrusted code · denied egress · disposable</text><rect x="70" y="885" width="620" height="76" rx="16" fill="#E8F4F1" stroke="#AACFC5"/><text x="90" y="916" font-size="18" font-weight="700" fill="#17252B">Isolated preview gateway → R2</text><text x="90" y="941" font-size="13" fill="#17252B">Unique preview origin · expiring access · static artifacts</text><rect x="935" y="885" width="285" height="76" rx="16" fill="#F0F1F2" stroke="#D9E0DD"/><text x="955" y="916" font-size="18" font-weight="700" fill="#17252B">GitHub</text><text x="955" y="941" font-size="13" fill="#17252B">External source / PR integration</text><path d="M270 822 V885" stroke="#7D908C" stroke-width="2" marker-end="url(#arrow)"/><text x="44" y="1007" font-size="13" fill="#59676D">Separate traffic plane: approved project hostname → gateway Worker → verified customer origin.</text><text x="44" y="1027" font-size="12" fill="#59676D">Overview only. Detailed bindings, data writes, domain isolation and rollout gates are in the blueprint.</text></g></svg>